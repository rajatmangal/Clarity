name: Build Clarity
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
# Serialize each branch/tag so an older build cannot replace a newer one.
concurrency:
  group: clarity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:prepare
      - run: npm run test:integration
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:mac
            label: macOS
          - os: windows-latest
            command: npm run desktop:windows
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set desktop build version
        run: node scripts/ci-build-version.mjs
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.label == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.label == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Clarity-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Clarity-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          See your spending. Plan your saving.

          Includes guided setup for your name, currency, Markdown vault location, and theme, with explanations of local storage and optional AI. Reopen it from Settings anytime.

          Download the Apple Silicon or Intel DMG for macOS, or the x64 EXE installer for Windows. Desktop builds include their runtime; Node.js is not required.

          These are unsigned preview builds. Apple signing/notarization and Windows signing are not configured. Operating systems may show publisher warnings. Back up your Markdown vault before upgrading, and close other Clarity instances using that vault.

          Browser/server setup and the user guide are in the repository README. Desktop builds check for updates in-app. Mac automatic installation requires Developer ID signing; unsigned Mac builds provide update notifications and a download link.
          EOF
          set -euo pipefail
          if [[ "$RELEASE_REF" == "refs/heads/main" ]]; then
            # Keep versioned binaries for clients that already fetched an older manifest.
            test -s installers/latest.yml
            test -s installers/latest-mac.yml
            # Stable filenames keep README links valid across version changes.
            mkdir latest-installers
            shopt -s nullglob
            mac_arm=(installers/Clarity-*-mac-arm64.dmg)
            mac_intel=(installers/Clarity-*-mac-x64.dmg)
            windows=(installers/Clarity-*-win-x64.exe)
            for platform in mac_arm mac_intel windows; do
              declare -n files="$platform"
              if [[ "${#files[@]}" -ne 1 ]]; then
                echo "Expected exactly one installer for $platform" >&2
                exit 1
              fi
            done
            cp "${mac_arm[0]}" latest-installers/Clarity-mac-arm64.dmg
            cp "${mac_intel[0]}" latest-installers/Clarity-mac-x64.dmg
            cp "${windows[0]}" latest-installers/Clarity-windows-x64.exe
            printf '\nRolling preview from main: https://github.com/%s/commit/%s\n' "$GH_REPO" "$RELEASE_SHA" >> release-notes.md
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest installers/*.dmg installers/*.exe installers/*.zip installers/*.blockmap latest-installers/* --clobber
              # Publish manifests last, after every file they reference is available.
              gh release upload latest installers/latest*.yml --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$RELEASE_SHA" -F force=true
              gh release edit latest --title "Clarity — Latest build" --notes-file release-notes.md --prerelease --latest=false
            else
              gh release create latest installers/*.dmg installers/*.exe installers/*.zip installers/*.blockmap latest-installers/* --target "$RELEASE_SHA" --prerelease --latest=false --title "Clarity — Latest build" --notes-file release-notes.md
              gh release upload latest installers/latest*.yml --clobber
            fi
          else
            shopt -s nullglob
            versioned=(installers/*.dmg installers/*.exe installers/*.zip installers/*.blockmap installers/latest*.yml)
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${versioned[@]}" --clobber
              gh release edit "$RELEASE_TAG" --title "Clarity $RELEASE_TAG" --notes-file release-notes.md --prerelease
            else
              gh release create "$RELEASE_TAG" "${versioned[@]}" --verify-tag --prerelease --title "Clarity $RELEASE_TAG" --notes-file release-notes.md
            fi
          fi
