name: Build Clarity
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:prepare
      - run: npm run test:integration
  desktop:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:mac
            label: macOS
          - os: windows-latest
            command: npm run desktop:windows
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Clarity-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Clarity-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          See your spending. Plan your saving.

          Download the Apple Silicon or Intel DMG for macOS, or the x64 EXE installer for Windows. Desktop builds include their runtime; Node.js is not required.

          These are unsigned preview builds. Apple signing/notarization and Windows signing are not configured. Operating systems may show publisher warnings. Back up your Markdown vault before upgrading, and close other Clarity instances using that vault.

          Browser/server setup and the user guide are in the repository README. Updates are installed manually.
          EOF
          gh release create "$RELEASE_TAG" installers/*.dmg installers/*.exe --verify-tag --prerelease --title "Clarity $RELEASE_TAG" --notes-file release-notes.md
