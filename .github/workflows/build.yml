name: Build Clarity
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:prepare
      - run: npm run test:integration
  desktop:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:mac
            label: macOS
          - os: windows-latest
            command: npm run desktop:windows
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Clarity-${{ matrix.label }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
